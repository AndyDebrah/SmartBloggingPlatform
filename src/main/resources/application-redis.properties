## Sample properties to enable Redis-backed revocation and refresh token storage
# Place these in your active profile (or set equivalent environment variables)

# Enable Redis stores (values: redis | memory)
security.revocation.store=redis
security.refresh.store=redis

# Redis connection (adjust for your environment)
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=60000

# Optional: use TLS, user, password via standard Spring Redis properties
# spring.redis.password=YOUR_PASSWORD
# spring.redis.ssl.enabled=true

# Notes:
# - When enabled, RedisRevocationService and RedisRefreshTokenService will be
#   created automatically (they are conditional on the above properties).
# - For local development you can leave the values as memory (default), which
#   uses the existing in-memory token stores.
