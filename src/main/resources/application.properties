#  Base Configuration
spring.application.name=SmartBloggingPlatform
spring.profiles.active=local
server.port=8080
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/smart_blog_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# HikariCP
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/smart_blog_nosql

# Caching
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s
spring.cache.cache-names=posts,users,tags,commentsByPost,reviewsByPost,reviewsByUser,reviewStatsByPost
app.optimization.reviewStats.singleQuery=true

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
# Limit package scanning to REST controllers so Springdoc finds your endpoints
# Was incorrectly pointing to `com.smartblog.ui.controller` (no REST controllers there)
springdoc.packages-to-scan=com.smartblog.controller
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# GraphQL
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.path=/graphql

# Actuator
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=when-authorized

# OAuth2 (Google) - Epic 4
# Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in environment for local/prod runs.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# Logging
logging.level.com.smartblog=INFO
logging.file.name=app-log.txt

# Epic 2 async execution settings
app.async.enabled=true
app.async.corePoolSize=8
app.async.maxPoolSize=32
app.async.queueCapacity=300
app.async.threadNamePrefix=epic2-exec-
app.async.awaitTerminationSeconds=30

