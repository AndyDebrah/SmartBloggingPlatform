## Test profile overrides for local development and profiling
# Disable OAuth2 and default security auto-configuration for test runs
# and explicitly exclude Mongo/Redis auto-configurations to reduce background noise during profiling
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.OAuth2ClientAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoReactiveDataAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Datasource: isolated in-memory H2 for repeatable test/coverage runs
spring.datasource.url=jdbc:h2:mem:smartblogtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep tests self-contained (no external MySQL dependency during coverage)
spring.flyway.enabled=false

# JPA defaults for test profile
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Reduce noise
logging.level.org.springframework=INFO
logging.level.com.smartblog=DEBUG

# Disable devtools restart/file-watcher during profiling to avoid large allocations
spring.devtools.restart.enabled=false

# Enable Hibernate SQL logging and parameter binding for profiling correlation
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Force a fixed port for profiling runs so load targets the same JVM instance
server.port=8080

# Explicitly disable external datastore clients to avoid background monitors
spring.redis.enabled=false

# Epic-2 async feature toggle for profiling tests (set to true to enable async paths)
app.async.enabled=true

# Expose actuator endpoints for metrics and Prometheus scraping during profiling
management.endpoints.web.exposure.include=health,info,metrics,prometheus,beans,loggers
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
